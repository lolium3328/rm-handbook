[book]
title = "RM 算法组新人手册"
description = "面向 RoboMaster 算法组新人的工程思维、问题解决与算法学习手册。"
language = "zh-CN"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
site-url = "/rm-handbook/"
git-repository-url = "https://github.com/lolium3328/rm-handbook"
edit-url-template = "https://github.com/lolium3328/rm-handbook/edit/main/{path}"
additional-css = ["theme/custom.css"]
