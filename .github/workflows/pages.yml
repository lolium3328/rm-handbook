name: Build and deploy mdBook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install mdBook
        env:
          MDBOOK_SHA256: 5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89
        run: |
          set -euo pipefail
          mdbook_version="$(cat .mdbook-version)"
          archive="$RUNNER_TEMP/mdbook.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/v${mdbook_version}/mdbook-v${mdbook_version}-x86_64-unknown-linux-musl.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MDBOOK_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
